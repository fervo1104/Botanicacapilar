<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Botanica Capilar</title>
    <link rel="stylesheet" href="./css/index.css">
    </head>

    <body>

        <nav>
            <span class="nav-logo">Botanica Capilar</span>
            <ul>
                <li><a href="#">Catálogo</a></li>
                <li><a href="#">Nosotros</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
            <img class="nav-logo-img" src="logo.png" alt="logo">
        </nav>

        <div class="hero">
            <div class="hero-left">
                <span class="badge">100% Ingredientes Naturales</span>
                <h1>Cuidamos tu <em>cabello</em>,<br>protegemos el planeta.</h1>
                <p class="hero-desc">
                    Shampoos, mascarillas y acondicionadores<br>
                    hechos con materiales naturales<br>
                    que cuidan nuestro planeta
                </p>
                <div class="btn-row">
                    <button class="btn-primary">Explorar<br>Colección</button>
                    <button class="btn-secondary">Nuestra<br>historia</button>
                </div>
            </div>

            <div class="hero-right">
                <img src="/imagenes/moradp.jpg" alt="Producto 1">
                <img src="/imagenes/amarillo.jpg" alt="Producto 2">
                <img src="/imagenes/durazno.jpg" alt="Producto 3">
                <img src="/imagenes/todos.jpg" alt="Producto 4">
            </div>
        </div>
    </body>

</html>
